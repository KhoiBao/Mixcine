name: Flutter Web CI/CD

# 1. Khi nào kích hoạt?
on:
  push:
    branches: [ "main", "master", "beta-main" ]
  pull_request:
    branches: [ "main", "master", "beta-main" ]

# 2. Hành động cần làm
jobs:
  build-and-push:
    runs-on: ubuntu-latest  # mượn một máy ảo Ubuntu

    steps:
      - name: 1. Kéo code về máy ảo
        uses: actions/checkout@v3

      # --- SỰ KHÁC BIỆT LỚN NHẤT NẰM Ở ĐÂY ---
      - name: 2. Cài đặt môi trường Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0' # Có thể đổi thành version bro đang xài, hoặc dùng 'any'
          channel: 'stable'
          cache: true # Tự động cache lại để lần sau chạy mượt hơn

      - name: 3. Tải thư viện và Build code ra bản Web
        run: |
          flutter pub get
          flutter build web

      # ----------------------------------------
      - name: 4. Đăng nhập vào Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 5. Build và đẩy (Push) Docker Image lên Hub
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          # Đổi tên image cho hợp với project Flutter
          tags: bimapbeo1001/scu-flutter-web:latest
