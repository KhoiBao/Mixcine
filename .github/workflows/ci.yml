name: Flutter Web CI/CD

# 1. Khi nào kích hoạt?
on:
  push:
    branches: [ "main", "master", "beta-main" ]
  pull_request:
    branches: [ "main", "master", "beta-main" ]

# 2. Hành động cần làm
jobs:
  build-and-push:
    runs-on: ubuntu-latest  # mượn một máy ảo Ubuntu

    steps:
      - name: 1. Kéo code về máy ảo
        uses: actions/checkout@v3

      - name: 2. Cài đặt môi trường Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'any' 
          channel: 'stable'
          cache: true

      - name: 3. Tải thư viện và Build code ra bản Web
        working-directory: ./mixcine_movie_app  # Ép con bot chui vào phòng code
        run: |
          flutter pub get
          flutter build web

      - name: 4. Đăng nhập vào Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 5. Build và đẩy (Push) Docker Image lên Hub
        uses: docker/build-push-action@v4
        with:
          context: ./mixcine_movie_app  # BẮT BUỘC TRỎ VÀO ĐÂY ĐỂ TÌM DOCKERFILE
          push: true
          tags: bimapbeo1001/scu-flutter-web:latest