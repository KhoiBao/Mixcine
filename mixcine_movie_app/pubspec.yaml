name: mixcine_movie_app
description: A Flutter movie app demo inspired by a Figma design handoff.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  dio: ^5.9.2
  cached_network_image: ^3.4.1
  go_router: ^17.2.0
  video_player: ^2.11.1
  shared_preferences: ^2.5.5
  sqflite: ^2.3.3+1
  sqflite_common_ffi: ^2.3.2+1
  sqlite3_flutter_libs: ^0.5.24
  path: ^1.9.0
  firebase_auth: ^6.5.2
  firebase_core: ^4.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
