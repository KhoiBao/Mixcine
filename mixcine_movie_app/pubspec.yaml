name: mixcine_movie_app
description: A Flutter movie app demo inspired by a Figma design handoff.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  dio: ^5.9.2
  cached_network_image: ^3.4.1
  go_router: ^17.2.0
  webview_flutter: ^4.10.0
  video_player: ^2.11.1
  shared_preferences: ^2.5.5
  supabase_flutter: ^2.8.1
  google_sign_in: ^6.2.1
  path: ^1.9.0
  intl: ^0.20.2
  crypto: ^3.0.7
  image_picker: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
